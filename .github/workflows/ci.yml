name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: phpunit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backend_journey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: backend_journey_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, intl
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The suite runs against real PostgreSQL because the schema uses jsonb and
      # partial unique indexes, which sqlite cannot express.
      - name: Migrate
        run: php artisan migrate --force

      - name: Tests
        run: vendor/bin/phpunit

  style:
    name: pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/pint --test

  types:
    name: generated types are current
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, intl
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Catches a DTO changed without regenerating resources/types/api.d.ts,
      # which would leave both SPAs type-checking against a stale contract.
      - name: Regenerate and diff
        run: |
          php artisan typescript:transform
          git diff --exit-code -- resources/types/api.d.ts
